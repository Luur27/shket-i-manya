<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>dev: все сцены</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Pangolin&display=swap">
<link rel="stylesheet" href="app.css">
<style>
body{margin:0;background:#ddd;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px;height:auto;user-select:auto}
figure{margin:0;background:#fff;border-radius:8px;overflow:hidden}
figure svg{display:block;width:100%;aspect-ratio:2/3}
figcaption{font:12px/1.2 system-ui;padding:3px 6px}
</style>
</head><body>
<script src="art.js"></script>
<script src="scenes.js"></script>
<script>
// ?tod=night — все сцены в одном времени суток; ?v=box — показать вариант «resolved»
const S = SCENES_API, A = ART, q = new URLSearchParams(location.search);
const TODS = ['day', 'evening', 'night', 'morning'];
let n = 0, h = '';
const only = q.get('only') ? q.get('only').split(',') : null;
if (only) document.body.style.gridTemplateColumns = `repeat(${only.length},1fr)`;
for (const s of S.SCENES.filter(x => !only || only.includes(x.id))) {
  const tod = q.get('tod') || (s.when({ tod: 'night', away: 1e9, now: new Date(2026, 10, 19), months: 16, years: 1 }) ? 'night' : TODS[n % 4]);
  const now = s.id === 'anniversary' ? new Date(2026, 6, 19) : s.id === 'newyear' ? new Date(2026, 11, 31) : s.id === 'feb14' ? new Date(2027, 1, 14) : s.id === 'mar8' ? new Date(2027, 2, 8) : new Date(2026, 10, 19);
  const ctx = S.makeCtx({ uid: 'd' + (++n), tod, now, away: 40 * 3600e3, seed: .2, variant: q.get('v') === s.id ? 'resolved' : '' });
  const opt = s.roomOpt ? s.roomOpt(ctx) : {};
  h += `<figure><svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">${A.defs(ctx.uid, tod)}${A.room(ctx.uid, tod, opt)}${s.draw(ctx)}${A.overlay(ctx.uid, tod)}${s.glow ? s.glow(ctx) : ''}</svg><figcaption>${s.id} · ${tod}</figcaption></figure>`;
}
document.body.innerHTML = h;
</script>
</body></html>
