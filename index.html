<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Шкет и Маня</title>
<meta name="description" content="Шкет, Маня и Пингвин живут здесь и всегда чем-нибудь заняты.">
<meta name="theme-color" content="#efe2d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Шкет и Маня">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Pangolin&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body data-tod="day">
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Шкет и Маня</h1>
      <p class="together" id="together"></p>
    </div>
    <button class="icon-btn" id="btnAlbum" type="button" aria-label="Альбом открыток">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 15l4.5-4 4 3.5 3-2.5 5 4"/><circle cx="15.5" cy="8.5" r="1.6"/></svg>
      <span class="badge" id="albumBadge" hidden></span>
    </button>
  </header>

  <main class="stage" id="stage" aria-label="Комната, где живут Шкет, Маня и Пингвин"></main>

  <section class="caption" aria-live="polite">
    <p class="away" id="away"></p>
    <p class="story" id="story"></p>
    <p class="newcard" id="newcard" hidden>Новая открытка в альбоме!</p>
    <div class="note" id="note" hidden><p id="noteText"></p><p class="sign" id="noteSign"></p></div>
    <div class="game-btns" id="gameBtns" hidden></div>
  </section>

  <nav class="bar" aria-label="Что сделать">
    <button class="tool" id="btnFeed" type="button">
      <svg viewBox="-24 -24 48 48" aria-hidden="true"><circle cx="0" cy="3" r="14" fill="#f7a23b" stroke="#c9741c" stroke-width="2"/><ellipse cx="5" cy="-12" rx="7" ry="3.2" fill="#6fae4f" transform="rotate(-25 5 -12)"/></svg>
      <span>Покормить</span>
    </button>
    <button class="tool" id="btnWear" type="button">
      <svg viewBox="-24 -24 48 48" aria-hidden="true"><path d="M-12 16L0 -16L12 16Z" fill="#f4a1b5" stroke="#a35d6e" stroke-width="2" stroke-linejoin="round"/><g fill="#fff"><circle cx="-3" cy="6" r="2"/><circle cx="4" cy="-2" r="2"/></g><circle cx="0" cy="-17" r="4.5" fill="#ffd36b"/></svg>
      <span>Нарядить</span>
    </button>
    <button class="tool" id="btnHide" type="button">
      <svg viewBox="-24 -24 48 48" aria-hidden="true"><circle cx="-4" cy="-4" r="11" fill="none" stroke="#7a5a8c" stroke-width="3.2"/><path d="M4 4L14 14" stroke="#7a5a8c" stroke-width="4" stroke-linecap="round"/></svg>
      <span>Прятки</span>
    </button>
    <button class="tool" id="btnSleep" type="button">
      <svg viewBox="-24 -24 48 48" aria-hidden="true"><path d="M6 -16A14 14 0 1 0 14 8A11 11 0 0 1 6 -16Z" fill="#ffd36b" stroke="#c9a03d" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Спать</span>
    </button>
  </nav>
</div>

<div class="tray" id="tray" hidden>
  <div class="tray-head">
    <p id="trayHint"></p>
    <button class="ghost-btn" id="trayClose" type="button">Готово</button>
  </div>
  <div class="foods" id="items"></div>
</div>

<div class="sheet" id="album" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <div style="flex:1;min-width:0">
        <h2 id="albumTitle">Альбом</h2>
        <p id="albumCount"></p>
      </div>
      <button class="ghost-btn" id="albumClose" type="button">Закрыть</button>
    </div>
    <div id="albumBody"></div>
  </div>
</div>

<div class="install" id="install" hidden>
  <h2>Поставь нас на экран «Домой»</h2>
  <ol>
    <li>Внизу Safari нажми «Поделиться» — квадрат со стрелкой вверх.</li>
    <li>Выбери «На экран „Домой“».</li>
    <li>Открывай нас с иконки: так мы будем как приложение, и альбом не потеряется.</li>
  </ol>
  <button class="ghost-btn" id="installOk" type="button">Понятно</button>
</div>

<div class="fx" id="fx"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="world.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
